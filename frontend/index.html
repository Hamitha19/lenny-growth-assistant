
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenny Growth Assistant</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #202938;
        }

        header {
            background: #202b46;
            color: white;
            padding: 22px;
            text-align: center;
        }

        header h1 { margin: 0 0 8px; font-size: 25px; }
        header p { margin: 0; color: #d9e2f4; }

        main {
            max-width: 850px;
            margin: 28px auto;
            padding: 0 16px;
        }

        #chat {
            background: white;
            min-height: 360px;
            max-height: 55vh;
            overflow-y: auto;
            padding: 20px;
            border: 1px solid #e1e5ee;
            border-radius: 12px;
        }

        .message {
            margin: 0 0 18px;
            padding: 13px 16px;
            border-radius: 10px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user {
            background: #e5edff;
            margin-left: 12%;
        }

        .assistant {
            background: #f0f2f6;
            margin-right: 8%;
        }

        .label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        #status {
            min-height: 24px;
            color: #58657b;
            margin: 12px 4px;
            font-size: 14px;
        }

        form {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        textarea {
            flex: 1;
            resize: vertical;
            min-height: 55px;
            padding: 14px;
            font: inherit;
            border: 1px solid #cbd2df;
            border-radius: 10px;
        }

        button {
            padding: 0 22px;
            background: #315bd6;
            color: white;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled { opacity: 0.6; cursor: wait; }

        #new-chat {
            margin-top: 12px;
            padding: 10px 14px;
            background: white;
            color: #315bd6;
            border: 1px solid #315bd6;
        }

        .sources {
            margin-top: 12px;
            font-size: 13px;
            color: #46536b;
        }

        .sources ul { padding-left: 20px; }

        @media (max-width: 550px) {
            form { flex-direction: column; }
            button { min-height: 46px; }
            .user, .assistant { margin-left: 0; margin-right: 0; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Lenny Growth Assistant</h1>
        <p>Explore product, growth, and startup lessons from Lenny's content.</p>
    </header>

    <main>
        <div id="chat" aria-live="polite">
            <div class="message assistant">
                <span class="label">Assistant</span>
                Hi! Ask me a question about product management, startup growth,
                or finding product-market fit.
            </div>
        </div>

        <div id="status" role="status"></div>

        <form id="chat-form">
            <textarea id="question" placeholder="Ask a question..." required></textarea>
            <button id="send" type="submit">Send</button>
        </form>

        <button id="new-chat" type="button">Start new conversation</button>
    </main>

    <script>
        const chat = document.getElementById("chat");
        const form = document.getElementById("chat-form");
        const question = document.getElementById("question");
        const sendButton = document.getElementById("send");
        const status = document.getElementById("status");
        const newChatButton = document.getElementById("new-chat");

        let sessionId = null;

        function addMessage(role, text) {
            const message = document.createElement("div");
            message.className = "message " + role;

            const label = document.createElement("span");
            label.className = "label";
            label.textContent = role === "user" ? "You" : "Assistant";

            const content = document.createElement("div");
            content.textContent = text;

            message.append(label, content);
            chat.appendChild(message);
            chat.scrollTop = chat.scrollHeight;

            return message;
        }

        function addSources(parent, sources) {
            if (!sources || sources.length === 0) return;

            const section = document.createElement("div");
            section.className = "sources";

            const heading = document.createElement("strong");
            heading.textContent = "Transcript sources";
            section.appendChild(heading);

            const list = document.createElement("ul");
            sources.forEach(source => {
                const item = document.createElement("li");
                item.textContent = source.source +
                    (source.chunk >= 0 ? " (chunk " + source.chunk + ")" : "");
                list.appendChild(item);
            });

            section.appendChild(list);
            parent.appendChild(section);
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();

            const messageText = question.value.trim();
            if (!messageText) return;

            addMessage("user", messageText);
            question.value = "";
            sendButton.disabled = true;
            status.textContent = "Thinking...";

            const answerElement = addMessage("assistant", "Generating answer...");

            try {
                const response = await fetch("http://127.0.0.1:8000/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: messageText,
                        session_id: sessionId
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Request failed.");
                }

                sessionId = data.session_id;

                answerElement.replaceChildren();

                const label = document.createElement("span");
                label.className = "label";
                label.textContent = "Assistant";

                const content = document.createElement("div");
                content.textContent = data.reply || "No answer was returned.";

                answerElement.append(label, content);
                addSources(answerElement, data.sources);

                status.textContent = "Model: " + (data.model || "configured model");
            } catch (error) {
                answerElement.replaceChildren();

                const label = document.createElement("span");
                label.className = "label";
                label.textContent = "Assistant";

                const content = document.createElement("div");
                content.textContent = "Sorry, something went wrong: " + error.message;

                answerElement.append(label, content);
                status.textContent = "Check that the backend server is running.";
            } finally {
                sendButton.disabled = false;
                question.focus();
            }
        });

        newChatButton.addEventListener("click", () => {
            sessionId = null;
            chat.replaceChildren();

            addMessage(
                "assistant",
                "New conversation started! What would you like to learn about?"
            );

            status.textContent = "Started a new session.";
            question.focus();
        });
    </script>
</body>
</html>
